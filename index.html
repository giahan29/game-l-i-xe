<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lái Xe Tránh Né</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #050508;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 750px;
            background: #0a0b12;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.35);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 9, 15, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 26px;
            margin: 0 0 8px 0;
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.8), 0 0 30px rgba(255, 0, 128, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #b0c4de;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .mode-title {
            font-size: 15px;
            color: #ff007f;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 240px;
        }
        .btn {
            padding: 14px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            background: transparent;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-easy {
            border-color: #00ff66;
            color: #00ff66;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.3);
        }
        .btn-easy:hover, .btn-easy:active {
            background: #00ff66;
            color: #000;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.7);
        }
        .btn-normal {
            border-color: #00f0ff;
            color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
        }
        .btn-normal:hover, .btn-normal:active {
            background: #00f0ff;
            color: #000;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
        }
        .btn-hard {
            border-color: #ff0055;
            color: #ff0055;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.3);
        }
        .btn-hard:hover, .btn-hard:active {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.7);
        }

        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .hud-item {
            background: rgba(10, 11, 20, 0.75);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.25);
            font-size: 13px;
            font-weight: bold;
            backdrop-filter: blur(4px);
        }
        .score-val { color: #00f0ff; font-size: 15px; text-shadow: 0 0 6px rgba(0, 240, 255, 0.5); }
        .lives-val { color: #ff0055; letter-spacing: 2px; text-shadow: 0 0 6px rgba(255, 0, 85, 0.5); }
        .diff-val { color: #ffe600; font-size: 12px; text-transform: uppercase; }

        .controls-mobile {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 5;
        }
        .touch-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(0, 240, 255, 0.1);
            border: 2px solid rgba(0, 240, 255, 0.35);
            color: #00f0ff;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }
        .touch-btn:active {
            background: rgba(0, 240, 255, 0.35);
            border-color: #00f0ff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- HUD Hiển thị thông tin -->
    <div class="hud">
        <div class="hud-item">ĐIỂM: <span id="score" class="score-val">0</span></div>
        <div class="hud-item"><span id="diff-label" class="diff-val">VỪA</span></div>
        <div class="hud-item">MẠNG: <span id="lives" class="lives-val">❤❤❤</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="700"></canvas>

    <!-- Phím điều khiển cảm ứng cho điện thoại -->
    <div class="controls-mobile">
        <div class="touch-btn" id="btn-left">◄</div>
        <div class="touch-btn" id="btn-right">►</div>
    </div>

    <!-- Màn hình Menu Bắt đầu -->
    <div id="start-overlay" class="overlay">
        <h1>LÁI XE TRÁNH NÉ</h1>
        <p>Hệ thống lái xe tự động.<br>Sử dụng nút <b>Trái / Phải</b> để né tránh giao thông!</p>
        <div class="mode-title">CHỌN MỨC ĐỘ</div>
        <div class="btn-group">
            <button class="btn btn-easy" onclick="startGame('easy')">DỄ</button>
            <button class="btn btn-normal" onclick="startGame('normal')">VỪA</button>
            <button class="btn btn-hard" onclick="startGame('hard')">KHÓ</button>
        </div>
    </div>

    <!-- Màn hình Thua cuộc -->
    <div id="gameover-overlay" class="overlay hidden">
        <h1 style="color:#ff0055; text-shadow: 0 0 15px rgba(255, 0, 85, 0.8);">SYSTEM CRASH</h1>
        <p>Điểm của bạn: <b id="final-score" style="color:#00f0ff; font-size: 22px;">0</b></p>
        <div class="mode-title">THỬ LẠI</div>
        <div class="btn-group">
            <button class="btn btn-easy" onclick="startGame('easy')">DỄ</button>
            <button class="btn btn-normal" onclick="startGame('normal')">VỪA</button>
            <button class="btn btn-hard" onclick="startGame('hard')">KHÓ</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const diffLabelEl = document.getElementById("diff-label");
    const finalScoreEl = document.getElementById("final-score");
    const startOverlay = document.getElementById("start-overlay");
    const gameoverOverlay = document.getElementById("gameover-overlay");

    let gameLoopId = null;
    let score = 0;
    let lives = 3;
    let currentDiff = 'normal';
    let baseSpeed = 5;
    let currentSpeed = 5;
    let baseSpawnInterval = 65;
    let currentSpawnInterval = 65;
    let frameCount = 0;
    let isGameOver = false;

    const DIFFICULTY_SETTINGS = {
        easy: { speed: 4.8, spawnRate: 75, label: "DỄ", color: "#00ff66" },
        normal: { speed: 7.2, spawnRate: 50, label: "VỪA", color: "#00f0ff" },
        hard: { speed: 12.5, spawnRate: 35, label: "KHÓ", color: "#ff0055" }
    };

    const road = {
        lanes: 4,
        laneWidth: canvas.width / 4,
        lineOffsetY: 0
    };

    const player = {
        lane: 1,
        x: 0,
        y: canvas.height - 110,
        width: 44,
        height: 74,
        color: "#00f0ff",
        targetX: 0,
        speedX: 0.28
    };

    let obstacles = [];
    let particles = [];
    let stars = [];

    for (let i = 0; i < 40; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2,
            speed: Math.random() * 1.5 + 0.5
        });
    }

    window.addEventListener("keydown", e => {
        if (isGameOver) return;
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") movePlayer(-1);
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") movePlayer(1);
    });

    document.getElementById("btn-left").addEventListener("touchstart", (e) => { e.preventDefault(); movePlayer(-1); });
    document.getElementById("btn-right").addEventListener("touchstart", (e) => { e.preventDefault(); movePlayer(1); });
    document.getElementById("btn-left").addEventListener("click", () => movePlayer(-1));
    document.getElementById("btn-right").addEventListener("click", () => movePlayer(1));

    function movePlayer(dir) {
        player.lane += dir;
        if (player.lane < 0) player.lane = 0;
        if (player.lane >= road.lanes) player.lane = road.lanes - 1;
    }

    function startGame(diff) {
        currentDiff = diff;
        const config = DIFFICULTY_SETTINGS[diff];
        
        score = 0;
        lives = 3;
        baseSpeed = config.speed;
        currentSpeed = baseSpeed;
        baseSpawnInterval = config.spawnRate;
        currentSpawnInterval = baseSpawnInterval;
        frameCount = 0;
        obstacles = [];
        particles = [];
        isGameOver = false;

        player.lane = 1;
        player.x = player.lane * road.laneWidth + (road.laneWidth - player.width) / 2;
        player.targetX = player.x;

        diffLabelEl.innerText = config.label;
        diffLabelEl.style.color = config.color;
        updateHUD();

        startOverlay.classList.add("hidden");
        gameoverOverlay.classList.add("hidden");

        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        gameLoop();
    }

    function updateHUD() {
        scoreEl.innerText = score;
        livesEl.innerText = "❤".repeat(lives);
    }

    function createObstacles() {
        let numCars = 1;
        const progress = Math.min(score / 500, 1);
        
        if (Math.random() < 0.25 + progress * 0.45) numCars = 2;
        if (currentDiff === 'hard' && Math.random() < 0.35) numCars = 3;

        const availableLanes = [0, 1, 2, 3];
        const chosenLanes = [];
        
        for (let i = 0; i < numCars; i++) {
            if (availableLanes.length <= 1) break;
            const randIndex = Math.floor(Math.random() * availableLanes.length);
            chosenLanes.push(availableLanes.splice(randIndex, 1)[0]);
        }

        const colors = ["#ff0055", "#ffcc00", "#ff00ff", "#ff5500"];

        chosenLanes.forEach(lane => {
            const color = colors[Math.floor(Math.random() * colors.length)];
            const width = 44;
            const height = 74;
            const x = lane * road.laneWidth + (road.laneWidth - width) / 2;

            obstacles.push({
                x: x,
                y: -100,
                width: width,
                height: height,
                color: color,
                passed: false
            });
        });
    }

    function spawnExplosion(x, y, color) {
        for (let i = 0; i < 20; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 2;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                color: color,
                life: 1.0,
                decay: Math.random() * 0.03 + 0.02
            });
        }
    }

    function update() {
        const speedBoostMultiplier = currentDiff === 'hard' ? 0.75 : 0.35;
        const speedBoost = Math.floor(score / 40) * speedBoostMultiplier;
        currentSpeed = baseSpeed + speedBoost;
        
        const spawnReduction = Math.floor(score / 40) * 2;
        currentSpawnInterval = Math.max(15, baseSpawnInterval - spawnReduction);

        player.targetX = player.lane * road.laneWidth + (road.laneWidth - player.width) / 2;
        player.x += (player.targetX - player.x) * player.speedX;

        road.lineOffsetY = (road.lineOffsetY + currentSpeed) % 40;

        stars.forEach(star => {
            star.y += star.speed + currentSpeed * 0.2;
            if (star.y > canvas.height) star.y = 0;
        });

        frameCount++;
        if (frameCount % Math.floor(currentSpawnInterval) === 0) {
            createObstacles();
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.y += currentSpeed;

            if (
                player.x < obs.x + obs.width &&
                player.x + player.width > obs.x &&
                player.y < obs.y + obs.height &&
                player.y + player.height > obs.y
            ) {
                spawnExplosion(player.x + player.width/2, player.y + player.height/2, obs.color);
                obstacles.splice(i, 1);
                lives--;
                updateHUD();

                if (lives <= 0) {
                    endGame();
                    return;
                }
                continue;
            }

            if (!obs.passed && obs.y > player.y + player.height) {
                obs.passed = true;
                score += 10;
                updateHUD();
            }

            if (obs.y > canvas.height + 100) {
                obstacles.splice(i, 1);
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.fillStyle = "#070810";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(0, 240, 255, 0.5)";
        stars.forEach(star => {
            ctx.fillRect(star.x, star.y, star.size, star.size * 3);
        });

        ctx.strokeStyle = "rgba(255, 0, 127, 0.25)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(0, canvas.height);
        ctx.moveTo(canvas.width, 0); ctx.lineTo(canvas.width, canvas.height);
        ctx.stroke();

        ctx.strokeStyle = "rgba(0, 240, 255, 0.4)";
        ctx.lineWidth = 3;
        ctx.setLineDash([22, 22]);
        ctx.lineDashOffset = -road.lineOffsetY;

        for (let i = 1; i < road.lanes; i++) {
            ctx.beginPath();
            ctx.moveTo(i * road.laneWidth, 0);
            ctx.lineTo(i * road.laneWidth, canvas.height);
            ctx.stroke();
        }
        ctx.setLineDash([]);

        drawCar(player.x, player.y, player.width, player.height, player.color, true);

        obstacles.forEach(obs => {
            drawCar(obs.x, obs.y, obs.width, obs.height, obs.color, false);
        });

        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 8;
            ctx.fillRect(p.x, p.y, 4, 4);
            ctx.restore();
        });
    }

    function drawCar(x, y, w, h, color, isPlayer) {
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 14;

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 8);
        ctx.fill();

        ctx.fillStyle = "#0f1016";
        ctx.fillRect(x + 5, y + (isPlayer ? 14 : 44), w - 10, 18);

        ctx.fillStyle = isPlayer ? "#ffffff" : "#ff0000";
        ctx.shadowColor = isPlayer ? "#ffffff" : "#ff0000";
        ctx.shadowBlur = 10;
        const lightY = isPlayer ? y + 2 : y + h - 6;
        ctx.fillRect(x + 4, lightY, 7, 4);
        ctx.fillRect(x + w - 11, lightY, 7, 4);

        ctx.restore();
    }

    function gameLoop() {
        if (isGameOver) return;
        update();
        draw();
        gameLoopId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
        isGameOver = true;
        finalScoreEl.innerText = score;
        gameoverOverlay.classList.remove("hidden");
    }
</script>
</body>
</html>
